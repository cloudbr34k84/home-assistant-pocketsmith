name: Tests

on:
  push:
  pull_request:
  schedule:
    - cron: "0 6 * * *"

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install test dependencies
        run: pip install -r requirements_test.txt

      - name: Run tests
        run: pytest tests/ -v --tb=short
